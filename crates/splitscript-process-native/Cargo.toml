[package]
name = "splitscript-process-native"
version = "0.1.0"
edition = "2024"
description = "Desktop process-memory bridge for the SplitScript VS Code debugger"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "splitscript-process-fixture"
path = "src/bin/process_fixture.rs"

[dependencies]
napi = { version = "3.12.2", default-features = false, features = ["napi8"] }
napi-derive = "3.6.3"
proc-maps = { version = "0.4.0", default-features = false }
read-process-memory = { version = "0.2.0", default-features = false }
sysinfo = { version = "0.39.3", default-features = false, features = [
    "multithread",
    "system",
] }

[build-dependencies]
napi-build = "2.4.1"
