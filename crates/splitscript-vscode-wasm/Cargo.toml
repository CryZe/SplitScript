[package]
name = "splitscript-vscode-wasm"
version = "0.1.0"
edition = "2024"
description = "Portable WebAssembly adapter for the SplitScript VS Code extension"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
splitscript = { path = "../.." }
